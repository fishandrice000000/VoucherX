server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: voucherx
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/voucherx?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:voucherx}
    password: ${DB_PASSWORD:voucherx}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:voucherx}
    password: ${RABBITMQ_PASSWORD:voucherx}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

voucherx:
  auth:
    code-ttl-seconds: 300
    code-cooldown-seconds: 60
    ip-limit-per-minute: 10
    token-ttl-seconds: 1800
    # 默认关闭。仅本地/测试环境可打开，生产环境不得暴露验证码。
    expose-code: ${AUTH_EXPOSE_CODE:false}
  shop-cache:
    ttl-seconds: 1800
    ttl-random-seconds: 300
    null-ttl-seconds: 120
    lock-ttl-seconds: 10
    lock-wait-millis: 3000
  seckill:
    publish-confirm-timeout-millis: 5000
    request-status-ttl-seconds: 86400
    # MySQL BUCKET 模式单次消费最多尝试的桶数，避免无限遍历。
    bucket-attempts: 3
  admission:
    # OFF 保留 V1 行为；FIXED/ADAPTIVE 为实验准入模式。
    mode: ${ADMISSION_MODE:OFF}
    local:
      enabled: ${ADMISSION_LOCAL_ENABLED:true}
      # 单实例突发保护；实验时可调高以避免遮蔽全局效果。
      rate-per-second: ${ADMISSION_LOCAL_RATE:1000}
      capacity: ${ADMISSION_LOCAL_CAPACITY:100}
    global:
      enabled: ${ADMISSION_GLOBAL_ENABLED:true}
      shared-rate: ${ADMISSION_SHARED_RATE:200}
      shared-capacity: ${ADMISSION_SHARED_CAPACITY:200}
      activity-rate: ${ADMISSION_ACTIVITY_RATE:200}
      activity-capacity: ${ADMISSION_ACTIVITY_CAPACITY:200}
      # 0 表示固定策略长期有效；自适应控制器应设置有限有效期。
      policy-ttl-millis: ${ADMISSION_POLICY_TTL_MS:0}
    controller:
      interval-millis: ${ADMISSION_CONTROLLER_INTERVAL_MS:2000}
      initial-rate: ${ADMISSION_INITIAL_RATE:100}
      min-rate: ${ADMISSION_MIN_RATE:10}
      max-rate: ${ADMISSION_MAX_RATE:400}
      alpha: ${ADMISSION_ALPHA:10}
      beta: ${ADMISSION_BETA:0.8}
      high-watermark: ${ADMISSION_HIGH_WATERMARK:1000}
      low-watermark: ${ADMISSION_LOW_WATERMARK:100}
      min-completion-ratio: ${ADMISSION_MIN_COMPLETION_RATIO:0.9}
      health-windows: ${ADMISSION_HEALTH_WINDOWS:3}
      cooldown-millis: ${ADMISSION_COOLDOWN_MS:10000}
      policy-ttl-millis: ${ADMISSION_CONTROLLER_POLICY_TTL_MS:10000}
  mq:
    max-retries: 3
    retry-ttl-millis: 5000
  delivery:
    enabled: ${DELIVERY_ENABLED:true}
    interval-millis: 250
    scan-size: 32
    lease-millis: 30000
    max-attempts: 8
    retry-millis: 1000
    batch-enabled: ${DELIVERY_BATCH_ENABLED:false}
    batch-size: 16
    batch-bytes: 1048576
    batch-wait-millis: 50
  commerce:
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:false}
    payment-timeout-millis: 900000
    expiry-interval-millis: 10000
    scan-size: 100
  reconcile:
    enabled: ${RECONCILE_ENABLED:false}
    interval-millis: 5000
    scan-size: 100
    stale-millis: 30000
    retry-millis: 5000
    max-attempts: 8
  recovery:
    page-size: 200
    max-records: 100000
  fault:
    enabled: ${FAULT_INJECTION_ENABLED:false}
    point: ${FAULT_POINT:}
    subject: ${FAULT_SUBJECT:*}
    action: ${FAULT_ACTION:FAIL}
    run-id: ${FAULT_RUN_ID:manual}
    wait-millis: 5000
    evidence-path: tmp/fault/evidence.jsonl
  experiment:
    # 仅用于隔离实验，默认关闭；不通过产品 HTTP 接口修改。
    enabled: ${EXPERIMENT_ENABLED:false}
    transaction-delay-millis: ${EXPERIMENT_TRANSACTION_DELAY_MS:0}
    delay-file: ${EXPERIMENT_DELAY_FILE:/tmp/voucherx-experiment-delay-ms}

logging:
  level:
    root: INFO
    com.voucherx: INFO
