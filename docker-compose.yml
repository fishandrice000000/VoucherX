# Docker Compose 仅启动基础设施；应用通过 Maven 或 IDE 启动。
# 端口特意避开本机常见的 3306 / 6379 / 5672。
services:
  mysql:
    image: mysql:8.0
    container_name: voucherx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: voucherx
      MYSQL_USER: voucherx
      MYSQL_PASSWORD: voucherx
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - voucherx-mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: voucherx-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - voucherx-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: voucherx-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: voucherx
      RABBITMQ_DEFAULT_PASS: voucherx
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - voucherx-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  voucherx-mysql-data:
  voucherx-redis-data:
  voucherx-rabbitmq-data:
